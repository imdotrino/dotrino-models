[package]
name = "dotrino-models-desktop"
version = "0.1.0"
edition = "2024"
description = "La ventana del gestor de modelos de Dotrino"
license = "MIT"

[[bin]]
name = "dotrino-models-desktop"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["tokio", "image"] }
open = "5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt"] }
dotrino-theme = { git = "https://github.com/imdotrino/dotrino-theme", rev = "bb1e5de" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

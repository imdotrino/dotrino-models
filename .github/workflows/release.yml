# Publica @dotrino/models DESDE CI, no desde el portátil de nadie.
#
# Sin ningún token: npm cambia un credencial efímero por la identidad OIDC de esta ejecución
# (publicación de confianza) y firma la procedencia él solo. La confianza se declara en
# npmjs.com, por paquete: repo `imdotrino/dotrino-models`, workflow `release.yml`. El nombre de
# este archivo tiene que coincidir exacto.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write      # crear la release y subirle el SBOM
  id-token: write      # OIDC: la publicación de confianza y la atestación
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # La publicación de confianza pide Node ≥22.14 y npm ≥11.5.1, y Node 22 trae npm 10.
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm i -g npm@latest
      - run: npm install

      # LAS PRUEBAS, ANTES DE PUBLICAR: tipos estrictos, pruebas del gestor y de la ventana.
      - run: npm run type-check
      - run: npm test
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev
      - run: cargo test --manifest-path desktop/Cargo.toml
      # El registro de compatibilidad (dotrino-roadmap, CONVENCIONES §14), antes de publicar.
      - run: npx --yes @dotrino/roadmap@latest check

      - name: SBOM (CycloneDX)
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@latest \
            --omit dev --output-format JSON \
            --output-file "sbom-$(node -p "require('./package.json').version").cdx.json"

      - name: Atestiguar el SBOM
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'sbom-*.cdx.json'

      # Se empaqueta UNA vez, se mide ese .tgz y se publica ESE archivo. La medida va adjunta a
      # la release: contra ella se comprueba lo que da npm antes de actualizarse solo (§15).
      - name: Empaquetar
        run: npm pack

      - name: Medir lo que se va a publicar
        run: |
          npx --yes @dotrino/update@latest integrity ./*.tgz > npm-integrity.json
          cat npm-integrity.json

      # LA FIRMA DEL PAQUETE, QUE NO DEPENDE DEL SITIO (CONVENCIONES §15.2): con ella se comprueba
      # el .tgz aunque el paquete y su medida salgan del mismo espejo.
      - name: Atestiguar el paquete
        id: attest-tgz
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: '*.tgz'
      - name: La firma junto a cada .tgz
        run: for f in *.tgz; do cp "${{ steps.attest-tgz.outputs.bundle-path }}" "$f.sigstore.json"; done

      - name: Publicar en npm ESE archivo
        run: npm publish ./*.tgz --access public

      # EL ESPEJO PROPIO (CONVENCIONES §15.2): el paquete, sus dependencias, la medida y la firma al
      # directorio estático de S3, para que el directorio de fuentes pueda mandar ahí si npm o
      # GitHub fallan. Credenciales por OIDC (rol dotrino-deps-publisher): ningún token guardado.
      - name: Instalar el paquete para saber sus dependencias
        run: mkdir mirror-deps && cd mirror-deps && npm init -y >/dev/null && npm install ../*.tgz --ignore-scripts --no-audit --no-fund
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::147464502454:role/dotrino-deps-publisher
          aws-region: us-east-1
      - name: Subir al espejo
        run: |
          npx --yes @dotrino/update@latest mirror --repo "${{ github.repository }}" --tag "${{ github.ref_name }}" \
            --lock mirror-deps/package-lock.json --release npm-integrity.json \
            $(for f in *.tgz.sigstore.json; do echo --release "$f"; done) \
            --upload s3://dotrino-deps ./*.tgz

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom-*.cdx.json
            npm-integrity.json
            *.tgz.sigstore.json
          generate_release_notes: true
